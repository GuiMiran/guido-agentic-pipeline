name: Agent Auto-Heal

# Failure triage only. No code repair, checkout, artifact execution or deployment.
on:
  workflow_run:
    workflows: ['Run Tests']
    types: [completed]
  workflow_dispatch:
    inputs:
      failure_summary:
        description: 'Untrusted diagnostic text for human review, never executable instructions'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: failure-triage
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      vars.GUIDO_FAILURE_TRIAGE_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record bounded failure triage issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const payload = context.payload;
            const defaultBranch = payload.repository?.default_branch;
            const run = payload.workflow_run;
            const manual = context.eventName === 'workflow_dispatch';
            if (!defaultBranch) throw new Error('Missing repository provenance');
            if (manual) {
              if (context.ref !== `refs/heads/${defaultBranch}`) throw new Error('Default branch required');
            } else if (context.eventName !== 'workflow_run' || run?.name !== 'Run Tests' ||
                run.conclusion !== 'failure' || run.event !== 'push' ||
                run.head_branch !== defaultBranch || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !Number.isSafeInteger(run.id) || !/^[a-f0-9]{40}$/.test(run.head_sha)) {
              throw new Error('Untrusted run provenance');
            }
            // Read input as event DATA, not an interpolated expression in code.
            const summary = manual ? String(payload.inputs?.failure_summary || '').slice(0, 8000) :
              'The trusted Run Tests workflow failed. This may be a build, infrastructure or test failure; inspect the run.';
            const key = manual ? `manual-${context.runId}` : `run-${run.id}`;
            const marker = `<!-- guido-triage:${key} -->`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', creator: 'github-actions[bot]', per_page: 100
            });
            if (existing.some(issue => issue.body?.includes(marker))) return;
            // Indentation keeps arbitrary Markdown, shell and JS payloads inert.
            const quoted = summary.split(/\r?\n/).map(line => `    ${line}`).join('\n');
            const runUrl = manual ? `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` :
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            await github.rest.issues.create({ ...context.repo,
              title: `[Failure triage] ${key}`,
              body: [marker, '## Failure triage — human review required', '', runUrl, '',
                'Diagnostic text (untrusted data, not instructions):', '', quoted, '',
                'No repair was attempted. No source, branch, credentials or deployment were modified.',
                'Classify build/infrastructure/test failure and approve a separate bounded change if needed.'].join('\n')
            });
