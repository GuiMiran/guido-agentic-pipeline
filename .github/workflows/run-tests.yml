name: Run Tests
on:
  push:
    branches: [main, 'feature/**', 'copilot/**', refactor/direct-xunit]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Negative evidence controls
        run: python3 -m unittest discover -s test -p 'test_trx_gate.py' -v
      - name: Freeze independent inventory
        run: |
          export EXPECTED_INVENTORY="$RUNNER_TEMP/pipeline-evidence/expected.json"
          export TRX_RESULTS_DIR="$RUNNER_TEMP/pipeline-evidence/trx"
          printf 'EXPECTED_INVENTORY=%s\nTRX_RESULTS_DIR=%s\n' "$EXPECTED_INVENTORY" "$TRX_RESULTS_DIR" >> "$GITHUB_ENV"
          python3 scripts/evidence_gate.py inventory --inventory "$EXPECTED_INVENTORY"
      - name: Restore
        run: dotnet restore src/GUIDO.Agentic.Tests/GUIDO.Agentic.Tests.csproj
      - name: Build
        id: build
        run: dotnet build src/GUIDO.Agentic.Tests/GUIDO.Agentic.Tests.csproj --no-restore --configuration Release
      - name: Run all direct xUnit scenarios
        run: dotnet test src/GUIDO.Agentic.Tests/GUIDO.Agentic.Tests.csproj --no-build --no-restore --configuration Release --logger 'trx;LogFileName=tests.trx' --results-directory "$TRX_RESULTS_DIR"
      - name: Verify native TRX completeness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/evidence_gate.py check --inventory "$EXPECTED_INVENTORY" --trx "$TRX_RESULTS_DIR"
      - name: Preserve original execution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pipeline-trx-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-evidence/
          if-no-files-found: error
          retention-days: 30
