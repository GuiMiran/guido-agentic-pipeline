name: Run Tests
on:
  push:
    branches: [main, 'feature/**', 'copilot/**', fix/allure-evidence-gate]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Evidence gate negative controls
        run: python3 -m unittest discover -s test -p 'test_evidence_gate.py' -v
      - name: Freeze expected scenarios before execution
        run: |
          export ALLURE_CONFIG="$RUNNER_TEMP/pipeline-evidence/allureConfig.json"
          export ALLURE_RESULTS_DIR="$RUNNER_TEMP/pipeline-evidence/allure"
          export TRX_RESULTS_DIR="$RUNNER_TEMP/pipeline-evidence/trx"
          export EXPECTED_INVENTORY="$RUNNER_TEMP/pipeline-evidence/expected.json"
          printf 'ALLURE_CONFIG=%s\nALLURE_RESULTS_DIR=%s\nTRX_RESULTS_DIR=%s\nEXPECTED_INVENTORY=%s\n' "$ALLURE_CONFIG" "$ALLURE_RESULTS_DIR" "$TRX_RESULTS_DIR" "$EXPECTED_INVENTORY" >> "$GITHUB_ENV"
          python3 scripts/evidence_gate.py inventory --inventory "$EXPECTED_INVENTORY"
          python3 -c 'import json,os; from pathlib import Path; Path(os.environ["ALLURE_CONFIG"]).write_text(json.dumps({"allure":{"directory":os.environ["ALLURE_RESULTS_DIR"]}}))'
      - name: Restore
        run: dotnet restore src/GUIDO.Agentic.Tests/GUIDO.Agentic.Tests.csproj
      - name: Build
        id: build
        run: dotnet build src/GUIDO.Agentic.Tests/GUIDO.Agentic.Tests.csproj --no-restore --configuration Release
      - name: Run all scenarios
        run: dotnet test src/GUIDO.Agentic.Tests/GUIDO.Agentic.Tests.csproj --no-build --no-restore --configuration Release --logger 'trx;LogFileName=tests.trx' --results-directory "$TRX_RESULTS_DIR"
      - name: Require complete matching passing evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/evidence_gate.py check --inventory "$EXPECTED_INVENTORY" --allure "$ALLURE_RESULTS_DIR" --trx "$TRX_RESULTS_DIR"
      - name: Preserve native evidence including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pipeline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-evidence/
          if-no-files-found: error
          retention-days: 30
